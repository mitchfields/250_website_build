<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coastal edge drop-off — Texas Gulf Coast</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js"
  }
}
</script>
<style>
  html,body{margin:0;height:100%;background:#eaeaea;font-family:ui-monospace,Menlo,monospace;overflow:hidden}
  #row{position:fixed;inset:0;display:flex}
  .p{position:relative;flex:1;border-right:1px solid #cfcfcf}
  .p:last-child{border-right:0}
  .p canvas{display:block}
  .p .lab{position:absolute;left:16px;top:14px;z-index:2;font:600 11px/1 ui-monospace,Menlo,monospace;
    letter-spacing:.14em;text-transform:uppercase;color:#12222c;background:rgba(255,255,255,.7);
    padding:7px 12px 6px;border-radius:99px}
  .p .sub{position:absolute;left:16px;top:44px;z-index:2;font:400 9.5px/1.5 ui-monospace,Menlo,monospace;
    letter-spacing:.08em;color:#5e6a70;max-width:230px}
  #status{position:fixed;left:16px;bottom:14px;z-index:3;font:400 10px/1 ui-monospace,Menlo,monospace;
    letter-spacing:.14em;text-transform:uppercase;color:#7d878c}
</style>
</head>
<body>
<div id="row">
  <div class="p" id="p0"><div class="lab">A — flat gap, navy wall</div><div class="sub">sea recedes to a plain backdrop; dark navy cliff face</div></div>
  <div class="p" id="p1"><div class="lab">B — flat gap, teal wall</div><div class="sub">same drop-off, brighter accent on the cliff face</div></div>
  <div class="p" id="p2"><div class="lab">C — water kept, navy wall + shadow</div><div class="sub">sea stays flat blue; soft shadow sells a floating slab</div></div>
</div>
<div id="status">loading elevation…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Corpus Christi → Galveston/Beaumont: barrier islands, bays, real coastline detail
const BBOX = { lonMin:-97.3, lonMax:-95.5, latMin:27.5, latMax:28.8 };
const Z = 9;
const RAMP = [
  [0,'#123f63'],[75,'#16527a'],[200,'#1b678e'],[450,'#23809c'],
  [900,'#3a9dab'],[1600,'#63bec2'],[2400,'#8ad8d2'],[3400,'#9fe3d8'],
];
const hex = s => [parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
const RAMP_C = RAMP.map(([m,c])=>[m,hex(c)]);
function rampColor(m){
  let a=RAMP_C[0],b=RAMP_C[RAMP_C.length-1];
  for(let j=0;j<RAMP_C.length-1;j++) if(m>=RAMP_C[j][0]&&m<=RAMP_C[j+1][0]){a=RAMP_C[j];b=RAMP_C[j+1];break;}
  const t=b[0]===a[0]?0:(m-a[0])/(b[0]-a[0]);
  return [0,1,2].map(k=>(a[1][k]+(b[1][k]-a[1][k])*t)/255);
}
const hex01 = h => [(h>>16&255)/255,(h>>8&255)/255,(h&255)/255];
const STATE_SRC = [
  'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_1_states_provinces_lakes.geojson',
  'https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_50m_admin_1_states_provinces_lakes.geojson',
];
async function loadLandFeats(){
  for(const url of STATE_SRC){
    try{
      const r=await fetch(url); if(!r.ok) continue;
      const gj=await r.json();
      const feats=gj.features.filter(f=>{
        const q=f.properties||{};
        return q.adm0_a3==='USA'||q.iso_a2==='US'||q.admin==='United States of America';
      });
      if(feats.length>20) return feats;
    }catch(e){ console.warn('land source failed', url, e); }
  }
  return [];
}
const ringsOf = geom => {
  const out=[];
  if(!geom) return out;
  if(geom.type==='Polygon') out.push(...geom.coordinates);
  else if(geom.type==='MultiPolygon') geom.coordinates.forEach(p=>out.push(...p));
  return out;
};
// real coastline/state polygons decide land vs sea — raw elevation<=0 is wrong here:
// this coast's marshes and bayous dip below 0m well inland of the actual shoreline
function rasterizeLandMask(G, feats){
  const cv=document.createElement('canvas'); cv.width=G.W; cv.height=G.H;
  const c=cv.getContext('2d',{willReadFrequently:true});
  c.fillStyle='#000'; c.fillRect(0,0,G.W,G.H);
  c.fillStyle='#fff';
  const toPX=(lon,lat)=>[mxf(lon)*G.n*256-G.tx0*256, myf(lat)*G.n*256-G.ty0*256];
  for(const f of feats) for(const ring of ringsOf(f.geometry)){
    const path=new Path2D();
    for(let i=0;i<ring.length;i++){ const [x,y]=toPX(ring[i][0],ring[i][1]); i?path.lineTo(x,y):path.moveTo(x,y); }
    path.closePath(); c.fill(path);
  }
  const d=c.getImageData(0,0,G.W,G.H).data;
  const mask=new Uint8Array(G.W*G.H);
  for(let i=0,p=0;i<mask.length;i++,p+=4) mask[i]=d[p];
  return mask;
}

const mxf = lon => (lon+180)/360;
const myf = lat => { const p=lat*Math.PI/180; return (1-Math.log(Math.tan(p)+1/Math.cos(p))/Math.PI)/2; };

function grid(z){
  const n=2**z;
  const tx0=Math.floor(mxf(BBOX.lonMin)*n), tx1=Math.floor(mxf(BBOX.lonMax)*n);
  const ty0=Math.floor(myf(BBOX.latMax)*n), ty1=Math.floor(myf(BBOX.latMin)*n);
  return { z,n,tx0,tx1,ty0,ty1, W:(tx1-tx0+1)*256, H:(ty1-ty0+1)*256 };
}

async function loadDEM(G){
  const cv=document.createElement('canvas'); cv.width=G.W; cv.height=G.H;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='rgb(128,0,0)'; ctx.fillRect(0,0,G.W,G.H);
  const jobs=[];
  for(let ty=G.ty0;ty<=G.ty1;ty++) for(let tx=G.tx0;tx<=G.tx1;tx++) jobs.push([tx,ty]);
  let failed=0;
  const one=([tx,ty],attempt=0)=>new Promise(res=>{
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>{ctx.drawImage(img,(tx-G.tx0)*256,(ty-G.ty0)*256);res();};
    img.onerror=()=>attempt<2 ? one([tx,ty],attempt+1).then(res) : (failed++,res());
    img.src=`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${G.z}/${tx}/${ty}.png`;
  });
  const CONC=14;
  for(let i=0;i<jobs.length;i+=CONC) await Promise.all(jobs.slice(i,i+CONC).map(j=>one(j)));
  const d=ctx.getImageData(0,0,G.W,G.H).data;
  const elev=new Float32Array(G.W*G.H);
  for(let i=0,p=0;i<elev.length;i++,p+=4) elev[i]=(d[p]*256+d[p+1]+d[p+2]/256)-32768;
  return elev;
}

function blur(src,W,H,r,passes){
  const N=r*2+1, cl=(v,m)=>v<0?0:v>m?m:v;
  let a=Float32Array.from(src), b=new Float32Array(W*H), t=new Float32Array(W*H);
  for(let p=0;p<passes;p++){
    for(let y=0;y<H;y++){ const o=y*W; let s=0;
      for(let k=-r;k<=r;k++) s+=a[o+cl(k,W-1)];
      for(let x=0;x<W;x++){ t[o+x]=s/N; s+=a[o+cl(x+r+1,W-1)]-a[o+cl(x-r,W-1)]; } }
    for(let x=0;x<W;x++){ let s=0;
      for(let k=-r;k<=r;k++) s+=t[cl(k,H-1)*W+x];
      for(let y=0;y<H;y++){ b[y*W+x]=s/N; s+=t[cl(y+r+1,H-1)*W+x]-t[cl(y-r,H-1)*W+x]; } }
    const sw=a; a=b; b=sw;
  }
  return a;
}

// land keeps a mild "A" smoothing (settled direction); sea is not modelled at all here —
// the point of this test is the hard drop at the coast, not underwater relief
function buildTile(elev, maskF, W, H, EXAG, opt){
  const GX=170, GY=Math.max(2,Math.round(170*H/W));
  const cell=6, plateW=GX*cell, plateH=GY*cell;
  const sample=(fx,fy)=>{
    const x0=fx|0,y0=fy|0,x1=Math.min(W-1,x0+1),y1=Math.min(H-1,y0+1);
    const tx=fx-x0,ty=fy-y0;
    const a=elev[y0*W+x0],b=elev[y0*W+x1],c=elev[y1*W+x0],d=elev[y1*W+x1];
    return (a+(b-a)*tx)*(1-ty)+(c+(d-c)*tx)*ty;
  };
  const smoothstep=(a,b,x)=>{ const t=Math.max(0,Math.min(1,(x-a)/(b-a))); return t*t*(3-2*t); };
  const sampleMaskT=(fx,fy)=>{
    const x0=fx|0,y0=fy|0,x1=Math.min(W-1,x0+1),y1=Math.min(H-1,y0+1);
    const tx=fx-x0,ty=fy-y0;
    const a=maskF[y0*W+x0],b=maskF[y0*W+x1],c=maskF[y1*W+x0],d=maskF[y1*W+x1];
    const v=(a+(b-a)*tx)*(1-ty)+(c+(d-c)*tx)*ty;
    return smoothstep(112,143,v);   // narrow but continuous band — still reads as a crisp cliff
  };
  const stx=(W-1)/(GX-1), sty=(H-1)/(GY-1);
  const FLOOR=-plateW*0.06;
  // this coast's real relief is only tens of metres over hundreds of km — clamp the rare
  // DEM spike/void pixel so it can't fake a mountain, and keep land genuinely subtle
  const CLAMP_MAX=180;
  const pos=new Float32Array(GX*GY*3), hgt=new Float32Array(GX*GY), eArr=new Float32Array(GX*GY), landArr=new Float32Array(GX*GY);
  for(let j=0;j<GY;j++) for(let i=0;i<GX;i++){
    const fx=i*stx, fy=j*sty, eRaw=sample(fx,fy), e=Math.max(0,Math.min(CLAMP_MAX,eRaw)), k=j*GX+i;
    const t=sampleMaskT(fx,fy);
    const y = FLOOR + (e*EXAG-FLOOR)*t;
    hgt[k]=y; eArr[k]=e; landArr[k]=t;
    pos[k*3]=i*cell-plateW/2; pos[k*3+1]=y; pos[k*3+2]=j*cell-plateH/2;
  }
  const EPS=Math.abs(FLOOR)*0.03;
  const L={x:0.42,y:0.82,z:-0.38};
  const vtxColor=(k,i,j)=>{
    const xw=hgt[j*GX+Math.max(0,i-1)], xe=hgt[j*GX+Math.min(GX-1,i+1)];
    const yn=hgt[Math.max(0,j-1)*GX+i], ys=hgt[Math.min(GY-1,j+1)*GX+i];
    const dzdx=(xe-xw)/(2*cell), dzdy=(ys-yn)/(2*cell);
    const inv=1/Math.hypot(-dzdx,1,-dzdy);
    let lam=(-dzdx*inv)*L.x+(inv)*L.y+(-dzdy*inv)*L.z; if(lam<0)lam=0;
    const shade=Math.min(1.05,0.4+0.6*lam);
    const base=rampColor(eArr[k]);
    return [Math.min(1,base[0]*shade),Math.min(1,base[1]*shade),Math.min(1,base[2]*shade)];
  };
  // per-vertex colour interpolation is what caused the icicles: any triangle spanning a
  // wall vertex and a sea vertex blends smoothly between navy/teal and pale gap colour
  // across its face. Any triangle touching the cliff or the floor gets ONE flat colour
  // (own, unshared vertices) instead — only genuinely all-land triangles stay shaded.
  const outPos=[], outCol=[];
  const ijOf = k => [k%GX, Math.floor(k/GX)];
  const pushTri=(ia,ib,ic)=>{
    const idxs=[ia,ib,ic];
    const allLand = idxs.every(k=>landArr[k]>=0.985);
    let cols;
    if (allLand) cols = idxs.map(k=>{ const [i,j]=ijOf(k); return vtxColor(k,i,j); });
    else {
      const maxH = Math.max(hgt[ia],hgt[ib],hgt[ic]);
      const flat = maxH>FLOOR+EPS ? opt.wall : opt.sea;
      cols = [flat,flat,flat];
    }
    for(let n=0;n<3;n++){
      const k=idxs[n];
      outPos.push(pos[k*3],pos[k*3+1],pos[k*3+2]);
      outCol.push(cols[n][0],cols[n][1],cols[n][2]);
    }
  };
  for(let j=0;j<GY-1;j++) for(let i=0;i<GX-1;i++){
    const a=j*GX+i,b=a+1,c=a+GX,d=c+1;
    pushTri(a,c,b); pushTri(b,c,d);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(outPos,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(outCol,3));
  const mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide}));
  const grp=new THREE.Group(); grp.add(mesh);
  return { grp, plateW, floor:FLOOR };
}

function addShadow(grp, plateW, floor){
  const S=256, cv=document.createElement('canvas'); cv.width=cv.height=S;
  const c=cv.getContext('2d');
  const g=c.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  g.addColorStop(0,'rgba(0,0,0,.38)'); g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g; c.fillRect(0,0,S,S);
  const tex=new THREE.CanvasTexture(cv);
  const plane=new THREE.Mesh(new THREE.PlaneGeometry(plateW*1.7,plateW*1.7),
    new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false}));
  plane.rotation.x=-Math.PI/2;
  plane.position.y=floor-4;
  grp.add(plane);
}

function makePanel(id, grp){
  const el=document.getElementById(id);
  const w=el.clientWidth, h=el.clientHeight;
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(w,h);
  el.appendChild(renderer.domElement);
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0xeaeaea);
  scene.add(grp);
  const box=new THREE.Box3().setFromObject(grp);
  const sphere=new THREE.Sphere(); box.getBoundingSphere(sphere);
  // orthographic, not perspective: a close, steep perspective camera makes a broad flat
  // plateau's far corner converge to a point, reading as a fake peak. Parallel projection
  // (matching the reference block-map images) removes that illusion entirely.
  const aspect=w/h, viewSize=sphere.radius*1.35;
  const camera=new THREE.OrthographicCamera(-viewSize*aspect,viewSize*aspect,viewSize,-viewSize,0.1,10000);
  const dir=new THREE.Vector3(0.06,0.88,0.62).normalize();
  camera.position.copy(sphere.center).addScaledVector(dir, sphere.radius*4);
  camera.lookAt(sphere.center);
  const controls=new OrbitControls(camera,renderer.domElement);
  controls.target.copy(sphere.center); controls.enableDamping=true; controls.dampingFactor=0.07;
  controls.maxPolarAngle=1.3; controls.update();
  (function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();
  addEventListener('resize',()=>{
    const w=el.clientWidth,h=el.clientHeight;
    renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
  });
}

(async()=>{
  const G=grid(Z);
  let elev=await loadDEM(G);
  const feats=await loadLandFeats();
  const maskRaw=rasterizeLandMask(G, feats);
  // keep the coastline as a smooth 0..255 field (blurred, not re-thresholded to hard
  // binary) — sampling a hard-edged raster onto a coarse mesh grid aliases into stray
  // isolated land/sea flips at concave corners, which is exactly the crack/gap artifact
  const maskF=blur(Float32Array.from(maskRaw), G.W, G.H, 20, 2);
  document.getElementById('status').textContent='building tiles…';
  elev=blur(elev,G.W,G.H,4,2);   // the "A" smoothing already picked, kept mild since this coast is naturally low-relief
  // fixed metres→scene ratio, not peak-normalized — chosen low since real relief here is
  // only a gentle rise, so the coastal drop-off reads as the dominant vertical feature
  const EXAG = 0.85;

  const GAP = hex01(0xe7e3da), WATER = hex01(0x1b5f82);
  const NAVY = hex01(0x051624), TEAL = hex01(0x63bec2);

  const tA=buildTile(elev,maskF,G.W,G.H,EXAG,{sea:GAP, wall:NAVY});
  const tB=buildTile(elev,maskF,G.W,G.H,EXAG,{sea:GAP, wall:TEAL});
  const tC=buildTile(elev,maskF,G.W,G.H,EXAG,{sea:WATER, wall:NAVY});
  addShadow(tC.grp, tC.plateW, tC.floor);

  makePanel('p0',tA.grp);
  makePanel('p1',tB.grp);
  makePanel('p2',tC.grp);
  document.getElementById('status').remove();
})();
</script>
</body>
</html>
