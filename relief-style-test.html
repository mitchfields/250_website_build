<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Relief style comparison</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js"
  }
}
</script>
<style>
  html,body{margin:0;height:100%;background:#eaeaea;font-family:ui-monospace,Menlo,monospace;overflow:hidden}
  #row{position:fixed;inset:0;display:flex}
  .p{position:relative;flex:1;border-right:1px solid #cfcfcf}
  .p:last-child{border-right:0}
  .p canvas{display:block}
  .p .lab{position:absolute;left:16px;top:14px;z-index:2;font:600 11px/1 ui-monospace,Menlo,monospace;
    letter-spacing:.14em;text-transform:uppercase;color:#12222c;background:rgba(255,255,255,.7);
    padding:7px 12px 6px;border-radius:99px}
  .p .sub{position:absolute;left:16px;top:44px;z-index:2;font:400 9.5px/1.5 ui-monospace,Menlo,monospace;
    letter-spacing:.08em;color:#5e6a70;max-width:220px}
  #status{position:fixed;left:16px;bottom:14px;z-index:3;font:400 10px/1 ui-monospace,Menlo,monospace;
    letter-spacing:.14em;text-transform:uppercase;color:#7d878c}
</style>
</head>
<body>
<div id="row">
  <div class="p" id="p0"><div class="lab">A — smoothed continuous</div><div class="sub">heavy blur, terrain still undulates</div></div>
  <div class="p" id="p1"><div class="lab">B — stepped bands</div><div class="sub">quantized into discrete elevation tiers</div></div>
  <div class="p" id="p2"><div class="lab">C — flat plateau</div><div class="sub">flat base, only major peaks rise</div></div>
</div>
<div id="status">loading elevation…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Bay Area → Sierra Nevada: real coast + real mountains, matches the reference's mix
const BBOX = { lonMin:-123.8, lonMax:-119.4, latMin:35.6, latMax:40.6 };
const Z = 8;
const EDGE_COLOR = 0x1b678e;
const RAMP = [
  [0,'#123f63'],[75,'#16527a'],[200,'#1b678e'],[450,'#23809c'],
  [900,'#3a9dab'],[1600,'#63bec2'],[2400,'#8ad8d2'],[3400,'#9fe3d8'],
];
const hex = s => [parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
const RAMP_C = RAMP.map(([m,c])=>[m,hex(c)]);
function rampColor(m){
  let a=RAMP_C[0],b=RAMP_C[RAMP_C.length-1];
  for(let j=0;j<RAMP_C.length-1;j++) if(m>=RAMP_C[j][0]&&m<=RAMP_C[j+1][0]){a=RAMP_C[j];b=RAMP_C[j+1];break;}
  const t=b[0]===a[0]?0:(m-a[0])/(b[0]-a[0]);
  return [0,1,2].map(k=>(a[1][k]+(b[1][k]-a[1][k])*t)/255);
}
const SEA_C = [0x12/255,0x30/255,0x48/255];

const mxf = lon => (lon+180)/360;
const myf = lat => { const p=lat*Math.PI/180; return (1-Math.log(Math.tan(p)+1/Math.cos(p))/Math.PI)/2; };

function grid(z){
  const n=2**z;
  const tx0=Math.floor(mxf(BBOX.lonMin)*n), tx1=Math.floor(mxf(BBOX.lonMax)*n);
  const ty0=Math.floor(myf(BBOX.latMax)*n), ty1=Math.floor(myf(BBOX.latMin)*n);
  return { z,n,tx0,tx1,ty0,ty1, W:(tx1-tx0+1)*256, H:(ty1-ty0+1)*256 };
}

async function loadDEM(G){
  const cv=document.createElement('canvas'); cv.width=G.W; cv.height=G.H;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='rgb(128,0,0)'; ctx.fillRect(0,0,G.W,G.H);
  const jobs=[];
  for(let ty=G.ty0;ty<=G.ty1;ty++) for(let tx=G.tx0;tx<=G.tx1;tx++) jobs.push([tx,ty]);
  await Promise.all(jobs.map(([tx,ty])=>new Promise(res=>{
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>{ctx.drawImage(img,(tx-G.tx0)*256,(ty-G.ty0)*256);res();};
    img.onerror=res;
    img.src=`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${G.z}/${tx}/${ty}.png`;
  })));
  const d=ctx.getImageData(0,0,G.W,G.H).data;
  const elev=new Float32Array(G.W*G.H);
  for(let i=0,p=0;i<elev.length;i++,p+=4) elev[i]=(d[p]*256+d[p+1]+d[p+2]/256)-32768;
  return elev;
}

function blur(src,W,H,r,passes){
  const N=r*2+1, cl=(v,m)=>v<0?0:v>m?m:v;
  let a=Float32Array.from(src), b=new Float32Array(W*H), t=new Float32Array(W*H);
  for(let p=0;p<passes;p++){
    for(let y=0;y<H;y++){ const o=y*W; let s=0;
      for(let k=-r;k<=r;k++) s+=a[o+cl(k,W-1)];
      for(let x=0;x<W;x++){ t[o+x]=s/N; s+=a[o+cl(x+r+1,W-1)]-a[o+cl(x-r,W-1)]; } }
    for(let x=0;x<W;x++){ let s=0;
      for(let k=-r;k<=r;k++) s+=t[cl(k,H-1)*W+x];
      for(let y=0;y<H;y++){ b[y*W+x]=s/N; s+=t[cl(y+r+1,H-1)*W+x]-t[cl(y-r,H-1)*W+x]; } }
    const sw=a; a=b; b=sw;
  }
  return a;
}

function variantSmooth(elev,W,H){ return blur(elev,W,H,7,4); }
function variantStepped(elev,W,H){
  const s=blur(elev,W,H,2,1);
  let top=-Infinity; for(let i=0;i<s.length;i++) if(s[i]>top) top=s[i];
  const BANDS=6;
  const step=top/BANDS;
  const q=new Float32Array(s.length);
  for(let i=0;i<q.length;i++) q[i]= s[i]<=0 ? s[i] : Math.round(s[i]/step)*step;
  return blur(q,W,H,1,1);
}
function variantFlat(elev,W,H){
  const s=blur(elev,W,H,4,3);
  const land=[...s].filter(v=>v>0).sort((a,b)=>a-b);
  const thresh=land[Math.floor(land.length*0.9)]||0;
  const band=Math.max(50,thresh*0.12);
  const clamp01=t=>t<0?0:t>1?1:t, smooth=t=>t*t*(3-2*t);
  const out=new Float32Array(s.length);
  for(let i=0;i<s.length;i++){
    const v=s[i];
    if(v<=0){ out[i]=v; continue; }
    const t=smooth(clamp01((v-(thresh-band))/(2*band)));
    const flatV=v*0.025, peakV=thresh*0.025+(v-thresh);
    out[i]=flatV+(peakV-flatV)*t;
  }
  return blur(out,W,H,4,2);
}

function buildTile(elev,W,H,peakScale){
  const GX=150, GY=Math.max(2,Math.round(150*H/W));
  const cell=6, plateW=GX*cell, plateH=GY*cell;
  const sample=(fx,fy)=>{
    const x0=fx|0,y0=fy|0,x1=Math.min(W-1,x0+1),y1=Math.min(H-1,y0+1);
    const tx=fx-x0,ty=fy-y0;
    const a=elev[y0*W+x0],b=elev[y0*W+x1],c=elev[y1*W+x0],d=elev[y1*W+x1];
    return (a+(b-a)*tx)*(1-ty)+(c+(d-c)*tx)*ty;
  };
  const stx=(W-1)/(GX-1), sty=(H-1)/(GY-1);
  const pos=new Float32Array(GX*GY*3), col=new Float32Array(GX*GY*3);
  const hgt=new Float32Array(GX*GY);
  for(let j=0;j<GY;j++) for(let i=0;i<GX;i++){
    const fx=i*stx, fy=j*sty, e=sample(fx,fy);
    const y = e<=0 ? e*peakScale*0.22 : e*peakScale;
    const k=j*GX+i;
    hgt[k]=y;
    pos[k*3]=i*cell-plateW/2; pos[k*3+1]=y; pos[k*3+2]=j*cell-plateH/2;
  }
  for(let j=0;j<GY;j++) for(let i=0;i<GX;i++){
    const k=j*GX+i;
    const xw=hgt[j*GX+Math.max(0,i-1)], xe=hgt[j*GX+Math.min(GX-1,i+1)];
    const yn=hgt[Math.max(0,j-1)*GX+i], ys=hgt[Math.min(GY-1,j+1)*GX+i];
    const dzdx=(xe-xw)/(2*cell), dzdy=(ys-yn)/(2*cell);
    const inv=1/Math.hypot(-dzdx,1,-dzdy);
    const nx=-dzdx*inv, ny=inv, nz=-dzdy*inv;
    const L={x:0.42,y:0.82,z:-0.38};
    let lam=nx*L.x+ny*L.y+nz*L.z; if(lam<0)lam=0;
    const e=sample(i*stx,j*sty);
    const base = e<=0 ? SEA_C : rampColor(e);
    const shade=Math.min(1.05,0.4+0.6*lam);
    col[k*3]=Math.min(1,base[0]*shade); col[k*3+1]=Math.min(1,base[1]*shade); col[k*3+2]=Math.min(1,base[2]*shade);
  }
  const idx=[];
  for(let j=0;j<GY-1;j++) for(let i=0;i<GX-1;i++){
    const a=j*GX+i,b=a+1,c=a+GX,d=c+1;
    idx.push(a,c,b, b,c,d);
  }
  const topGeo=new THREE.BufferGeometry();
  topGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  topGeo.setAttribute('color',new THREE.BufferAttribute(col,3));
  topGeo.setIndex(idx);
  topGeo.computeVertexNormals();
  const topMesh=new THREE.Mesh(topGeo,new THREE.MeshBasicMaterial({vertexColors:true}));

  // thick colored skirt around the tile perimeter, dropping to a shared base
  let minY=Infinity; for(let i=0;i<hgt.length;i++) if(hgt[i]<minY) minY=hgt[i];
  const baseY=minY-plateW*0.22;
  const perim=[];
  for(let i=0;i<GX;i++) perim.push([i,0]);
  for(let j=1;j<GY;j++) perim.push([GX-1,j]);
  for(let i=GX-2;i>=0;i--) perim.push([i,GY-1]);
  for(let j=GY-2;j>0;j--) perim.push([0,j]);
  const sp=[], sc=[];
  const n=perim.length;
  const dark=[EDGE_COLOR>>16&255,EDGE_COLOR>>8&255,EDGE_COLOR&255].map(v=>v/255*0.4);
  for(let s=0;s<n;s++){
    const [i,j]=perim[s], k=j*GX+i;
    const x=pos[k*3],y=pos[k*3+1],z=pos[k*3+2];
    sp.push(x,y,z, x,baseY,z);
    sc.push(...dark, ...dark);
  }
  const sidx=[];
  for(let s=0;s<n;s++){
    const a=s*2,b=a+1,c=((s+1)%n)*2,d=c+1;
    sidx.push(a,c,b, b,c,d);
  }
  const skirtGeo=new THREE.BufferGeometry();
  skirtGeo.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
  skirtGeo.setAttribute('color',new THREE.Float32BufferAttribute(sc,3));
  skirtGeo.setIndex(sidx);
  const skirtMesh=new THREE.Mesh(skirtGeo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide}));

  const grp=new THREE.Group();
  grp.add(topMesh,skirtMesh);
  return { grp, plateW, plateH, baseY };
}

function makePanel(id, grp){
  const el=document.getElementById(id);
  const w=el.clientWidth, h=el.clientHeight;
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(w,h);
  el.appendChild(renderer.domElement);
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0xeaeaea);
  scene.add(grp);
  const box=new THREE.Box3().setFromObject(grp);
  const sphere=new THREE.Sphere(); box.getBoundingSphere(sphere);
  const camera=new THREE.PerspectiveCamera(32,w/h,1,10000);
  const dist=sphere.radius/Math.sin(16*Math.PI/180)*1.08;
  camera.position.set(sphere.center.x+dist*0.56,sphere.center.y+dist*0.62,sphere.center.z+dist*0.56);
  const controls=new OrbitControls(camera,renderer.domElement);
  controls.target.copy(sphere.center); controls.enableDamping=true; controls.dampingFactor=0.07;
  controls.maxPolarAngle=1.35; controls.update();
  (function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();
  addEventListener('resize',()=>{
    const w=el.clientWidth,h=el.clientHeight;
    renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
  });
}

(async()=>{
  const G=grid(Z);
  const elev=await loadDEM(G);
  document.getElementById('status').textContent='building tiles…';
  let peak=-Infinity; for(let i=0;i<elev.length;i++) if(elev[i]>peak) peak=elev[i];
  const peakScale=(150*6*0.32)/peak;   // exaggerated, graphic-block proportions

  const tA=buildTile(variantSmooth(elev,G.W,G.H),G.W,G.H,peakScale);
  const tB=buildTile(variantStepped(elev,G.W,G.H),G.W,G.H,peakScale);
  const tC=buildTile(variantFlat(elev,G.W,G.H),G.W,G.H,peakScale);

  makePanel('p0',tA.grp);
  makePanel('p1',tB.grp);
  makePanel('p2',tC.grp);
  document.getElementById('status').remove();
})();
</script>
</body>
</html>
