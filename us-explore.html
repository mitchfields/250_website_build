<style>
  html, body { margin:0; padding:0; height:100%; background:#c3cfd9; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  #stage canvas { display:block; }

  #boot {
    position:fixed; inset:0; display:grid; place-content:center; justify-items:center;
    gap:18px; background:#c3cfd9; transition:opacity .7s ease; pointer-events:none;
  }
  /* no loading text/bar — the live cloud dive is the only load view */
  #boot .t, #boot .bar, #boot .s { display:none; }
  #boot .bar i { display:block; height:100%; width:0%; background:#1b678e; transition:width .35s ease; }

  #note {
    position:fixed; left:22px; bottom:20px; display:none; align-items:center; gap:9px;
    font:400 10px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing:.18em; text-transform:uppercase; color:#7d878c;
    opacity:0; transition:opacity .5s ease; pointer-events:none;
  }
  #note b { display:block; width:5px; height:5px; border-radius:50%; background:#1b678e; animation:p 1.4s ease-in-out infinite; }
  @keyframes p { 0%,100%{opacity:.25} 50%{opacity:1} }

  /* sun/moon toggle — a sliding thumb runs between the two icons */
  #theme {
    position:fixed; right:72px; bottom:104px; z-index:40; pointer-events:auto;
    display:flex; gap:0; padding:4px;
    background:rgba(9,28,40,.62); border:1px solid rgba(255,255,255,.12);
    border-radius:99px; opacity:0; transition:opacity 1s ease .3s, right .3s ease, left .3s ease, bottom .3s ease, background-color 1s ease, border-color 1s ease;
  }
  #theme .thumb {
    position:absolute; top:4px; left:4px; width:34px; height:34px; border-radius:50%;
    background:#eb5735; transition:transform .3s cubic-bezier(.22,.9,.24,1);
  }
  #theme[data-mode="dark"] .thumb { transform:translateX(34px); }
  #theme button {
    position:relative; z-index:1; width:34px; height:34px; display:grid; place-content:center;
    color:#a9bfcd; background:transparent; border:0; cursor:pointer; padding:0; border-radius:50%;
    transition:color .2s;
  }
  #theme button svg { width:17px; height:17px; display:block; }
  #theme button:hover { color:#eef4f7; }
  #theme button[aria-pressed="true"] { color:#fff; }

  /* zoom — a simple filled pill, + and − only; left edge aligned to the timeline */
  #zoom {
    position:fixed; left:72px; bottom:104px; z-index:40; display:flex; align-items:center; gap:12px;
    padding:7px 18px; background:rgba(238,240,242,.9);
    border:1.5px solid rgba(20,48,63,.42); border-radius:99px;
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    opacity:0; transition:opacity 1s ease .3s, background-color 1s ease, border-color 1s ease;
  }
  #zoom button {
    min-width:20px; height:28px; display:grid; place-content:center;
    font:400 21px/1 ui-monospace,"SF Mono",Menlo,monospace; color:#2c4a5e;
    background:transparent; border:0; cursor:pointer; transition:color .2s, transform .12s;
  }
  #zoom button:hover { color:#eb5735; }
  #zoom button:active { transform:scale(.9); }

  /* region jump — top-right pills */
  /* N/S/E/W tracks the lockup: right edge under the Share pill's right edge
     (x=1840/1920 → 4.16vw gutter), dropped just under it — so it scales in lockstep */
  /* line runs y=125.8/1920=6.55vw, from x=92.9 (logo left, 4.84vw) to x=1840.08
     (share right, 4.16vw gutter). Everything below the line snaps to those edges. */
  #regions {
    position:fixed; top:calc(6.55vw + 12px); right:4.16vw; z-index:40; display:flex; gap:6px;
    opacity:0; transition:opacity 1s ease .3s;
  }
  #regions button {
    font:400 9.5px/1 ui-monospace,"SF Mono",Menlo,monospace; letter-spacing:.16em; text-transform:uppercase;
    color:#cfe0ea; background:rgba(9,28,40,.62); border:1px solid rgba(255,255,255,.14);
    border-radius:99px; padding:8px 13px 7px; cursor:pointer; transition:background .2s, color .2s, border-color .2s;
  }
  #regions button:hover, #regions button[aria-pressed="true"] { background:rgba(9,28,40,.85); border-color:#eb5735; color:#fff; }

  /* top-left instructions */
  #hint {
    position:fixed; top:calc(6.55vw + 16px); left:4.84vw; z-index:16; pointer-events:none; max-width:360px;
    opacity:0; transition:opacity 1s ease .3s;
  }
  #hint .k {
    display:block; font:400 10px/1 ui-monospace,"SF Mono",Menlo,monospace;
    letter-spacing:.24em; text-transform:uppercase; color:#eb5735; margin:0 0 12px;
  }
  #hint p { margin:0; font:700 26px/1.2 Poppins,system-ui,sans-serif; color:#12303f; transition:color 1s ease; }

  /* the whole top lockup (logo · BUILT ON FREEDOM · Share your story) is ONE svg that
     scales purely by width, so every piece keeps its exact design position at any width */
  #topnav{position:fixed;top:0;left:0;width:100%;z-index:15;pointer-events:none}
  #topnav svg{display:block;width:100%;height:auto}
  #topnav .cls-11{stroke:rgba(18,43,63,.22);stroke-width:1.5px;transition:stroke 1s ease}
  #topnav .cls-6{fill:url(#topnav-lg)}
  #topnav .cls-2{fill:#002b49;font:700 15px Poppins,system-ui,sans-serif;transition:fill 1s ease}
  #topnav .cls-8,#topnav .cls-12{fill:#002b49;transition:fill 1s ease}
  #topnav .hit{pointer-events:auto;cursor:pointer}
  #topnav .hit:hover .cls-6{filter:brightness(1.1)}
  #topnav a.hit:hover .cls-12{fill:#eb5735}
  #topnav .hitbox{fill:transparent}
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJExporter } from 'three/addons/exporters/OBJExporter.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import * as ui from './explore-ui.js?v=20260902';
import { initClouds } from './clouds.js';
import { initBirds } from './birds.js';

/* ─── configuration ─────────────────────────────────────────────── */
const P = new URLSearchParams(location.search);
const THEME = (P.get('theme') || localStorage.getItem('usmap.theme')) === 'dark' ? 'dark' : 'light';

// A theme switch reloads (the relief colour + cast shading are baked into the
// texture, so the map can't recolour live). On that reload we take the FAST
// path: skip the long cloud-dive and reopen wherever the user was, so toggling
// the theme mid-map feels instant instead of resetting the whole experience.
const FAST_THEME = sessionStorage.getItem('usmap.themeswitch') === '1';
sessionStorage.removeItem('usmap.themeswitch');

/* theme toggle — recolours the scene in place (see applyTheme below): the relief
   itself is theme-independent, so we only swap the surround colour + re-bake the
   texture margin, with no reload and no replay of the intro */
const themeBar = document.getElementById('theme');
themeBar.dataset.mode = THEME;                    // slides the thumb to the active icon
for (const b of themeBar.querySelectorAll('button')) {
  b.setAttribute('aria-pressed', String(b.dataset.theme === THEME));
  b.addEventListener('click', () => applyTheme(b.dataset.theme));
}
window.__fastTheme = FAST_THEME;
let curTheme = THEME;                                // live theme (toggled without a reload)
let BG = THEME === 'dark' ? 0x032c47 : 0xeef0f2;     // light theme: soft off-white (cool grey) surround, not a pure-white void
const Z_FAST = +(P.get('zf') || 4);     // first pass — coarse but paints fast; z6 refines after
const Z_FINE = +(P.get('z')  || 6);     // refinement pass
const REF    = 6;                       // scene units = DEM pixels at this zoom
const EXAG   = +(P.get('e')  || 17);    // geometry exaggeration
const EXAG_S = +(P.get('es') || 38);    // hillshade exaggeration — carries fine detail
const BATHY  = 0.16;                    // seafloor relief compression
const LIFT_M = +(P.get('l') || 500);    // US plate sits proud by this much (metre-equivalent)
const SUN_AZ = 45, SUN_ALT = 26;        // degrees; light from the north-east
const FADE_KM = 420;                    // margin over which relief dissolves

let GREY     = THEME === 'dark' ? [0x03, 0x2c, 0x47] : [0xee, 0xf0, 0xf2];   // == BG. Everything outside the US bakes to this colour, now with a faint hillshade
const BORDER = [0x05, 0x16, 0x24];
const RAMP = [                          // metres → colour, weighted low
  [   0, '#123f63'], [  75, '#16527a'], [ 200, '#1b678e'], [ 450, '#23809c'],
  [ 900, '#3a9dab'], [1600, '#63bec2'], [2400, '#8ad8d2'], [3400, '#9fe3d8'],
];
const BBOX = { lonMin:-150, lonMax:-46, latMin:5, latMax:60 };
const CENTER = { lon:-98.5, lat:39.6 };
const TILE_URL = (z,x,y) => `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`;
const STATE_SRC = [
  // 1:10m — jsdelivr refuses this file (>20 MB limit), raw.githubusercontent serves it with CORS
  'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_1_states_provinces_lakes.geojson',
  'https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_50m_admin_1_states_provinces_lakes.geojson',
];

// Dark-theme CSS, applied/removed live so the toggle recolours in place (no reload)
const DARK_CSS = 'html,body,#boot{background:#032c47}#boot .t{color:#9cc4da}#boot .bar{background:#0b4468}'
    + '#boot .bar i{background:#6fc4c8}#boot .s{color:#5d8ba5}#note{color:#7ba8c2}'
    + '#note b{background:#6fc4c8}#theme{background:rgba(3,32,52,.7)}#theme button{color:#7ba8c2}'
    + '#topnav .cls-11{stroke:rgba(255,255,255,.16)}#topnav .cls-8,#topnav .cls-12{fill:#f2f6f8}#topnav .cls-2{fill:#002b49}'
    + '#hint p{color:#8fd8ce}'
    + '#zoom{background:rgba(3,44,71,.9);border-color:rgba(130,175,208,.6)}#zoom button{color:#8fb4d2}';
let darkStyleEl = null;
function applyDarkCss(on) {
  if (on && !darkStyleEl) { darkStyleEl = document.createElement('style'); darkStyleEl.textContent = DARK_CSS; document.head.appendChild(darkStyleEl); }
  else if (!on && darkStyleEl) { darkStyleEl.remove(); darkStyleEl = null; }
}
applyDarkCss(THEME === 'dark');

/* ─── progress ui ───────────────────────────────────────────────── */
const boot = document.getElementById('boot'), bar = document.getElementById('bar');
const phaseEl = document.getElementById('phase'), note = document.getElementById('note');
const noteT = document.getElementById('noteT');
let stageStart = 0, stageSpan = 1, live = false, loadFrac = 0;
function span(label, from, to) { phaseEl.textContent = label; stageStart = from; stageSpan = to - from; frac(0); }
function frac(f) {
  const p = stageStart + stageSpan * Math.min(1, f);
  if (!live) loadFrac = Math.max(loadFrac, p);   // real coarse-load progress → drives the silhouette fill
  const pct = Math.round(p * 100);
  if (live) noteT.textContent = `refining ${pct}%`;
  else { bar.style.width = pct + '%'; phaseEl.textContent = phaseEl.textContent.replace(/ \d+%$/, '') ; }
}
const tick = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));

/* ─── web mercator grid ─────────────────────────────────────────── */
const mxf = lon => (lon + 180) / 360;
const myf = lat => { const p = lat * Math.PI / 180; return (1 - Math.log(Math.tan(p) + 1 / Math.cos(p)) / Math.PI) / 2; };
const WORLD_REF = 256 * 2 ** REF;
const ORIGIN = { x: mxf(CENTER.lon) * WORLD_REF, y: myf(CENTER.lat) * WORLD_REF };
const latMid = (BBOX.latMin + BBOX.latMax) / 2;
const mppAt = z => 156543.03392 * Math.cos(latMid * Math.PI / 180) / 2 ** z;
const MPP_REF = mppAt(REF);

function grid(z) {
  const n = 2 ** z;
  const tx0 = Math.floor(mxf(BBOX.lonMin) * n), tx1 = Math.floor(mxf(BBOX.lonMax) * n);
  const ty0 = Math.floor(myf(BBOX.latMax) * n), ty1 = Math.floor(myf(BBOX.latMin) * n);
  const W = (tx1 - tx0 + 1) * 256, H = (ty1 - ty0 + 1) * 256;
  const scale = 2 ** (REF - z);                        // local px → scene units
  const px0 = tx0 * 256, py0 = ty0 * 256;
  return {
    z, W, H, tx0, tx1, ty0, ty1, px0, py0, scale, mpp: mppAt(z),
    toPX: (lon, lat) => [mxf(lon) * 256 * n - px0, myf(lat) * 256 * n - py0],
    // local pixel → scene unit, anchored on CENTER so both passes register exactly
    sx: fx => (px0 + fx) * scale - ORIGIN.x,
    sz: fy => (py0 + fy) * scale - ORIGIN.y,
    fadePx: FADE_KM * 1000 / mppAt(z),
  };
}

/* ─── 1. elevation tiles ────────────────────────────────────────── */
async function loadDEM(G, onFrac) {
  const cv = document.createElement('canvas');
  cv.width = G.W; cv.height = G.H;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = 'rgb(128,0,0)';                       // encodes 0 m
  ctx.fillRect(0, 0, G.W, G.H);

  const jobs = [];
  for (let ty = G.ty0; ty <= G.ty1; ty++) for (let tx = G.tx0; tx <= G.tx1; tx++) jobs.push([tx, ty]);

  let done = 0, failed = 0;
  const one = ([tx, ty], attempt = 0) => new Promise(res => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { ctx.drawImage(img, (tx - G.tx0) * 256, (ty - G.ty0) * 256); res(); };
    img.onerror = () => attempt < 2 ? one([tx, ty], attempt + 1).then(res) : (failed++, res());
    img.src = TILE_URL(G.z, tx, ty);
  });

  const CONC = 14;
  for (let i = 0; i < jobs.length; i += CONC) {
    await Promise.all(jobs.slice(i, i + CONC).map(j => one(j).then(() => onFrac(++done / jobs.length))));
  }
  if (failed) console.warn(`z${G.z}: ${failed} elevation tiles unavailable`);

  const d = ctx.getImageData(0, 0, G.W, G.H).data;
  const elev = new Float32Array(G.W * G.H);
  for (let i = 0, p = 0; i < elev.length; i++, p += 4) {
    elev[i] = (d[p] * 256 + d[p + 1] + d[p + 2] / 256) - 32768;
  }
  cv.width = cv.height = 1;
  return elev;
}

/* ─── 2. US polygons → mask + boundary rasters ──────────────────── */
async function loadStates() {
  for (const url of STATE_SRC) {
    try {
      const r = await fetch(url);
      if (!r.ok) { console.warn(`states ${r.status} ${url.split('/').pop()}`); continue; }
      const gj = await r.json();
      const feats = gj.features.filter(f => {
        const q = f.properties || {};
        const usa = q.adm0_a3 === 'USA' || q.iso_a2 === 'US' || q.admin === 'United States of America';
        const n = q.name || q.NAME || '';
        return usa && n !== 'Alaska' && n !== 'Hawaii';
      });
      if (feats.length > 20) { console.log(`states: ${feats.length} from ${url.split('/').pop()}`); return feats; }
    } catch (e) { console.warn('state source failed', url, e); }
  }
  console.warn('no state polygons available — tint will not be clipped');
  return [];
}

function ringsOf(geom) {
  const out = [];
  if (!geom) return out;
  if (geom.type === 'Polygon') out.push(...geom.coordinates);
  else if (geom.type === 'MultiPolygon') geom.coordinates.forEach(p => out.push(...p));
  return out;
}

function rasterStates(G, feats) {
  const { W, H } = G, k = G.scale;                      // stroke widths in scene-consistent terms
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d', { willReadFrequently: true });
  const bv = document.createElement('canvas'); bv.width = W; bv.height = H;
  const b = bv.getContext('2d', { willReadFrequently: true });

  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  c.fillStyle = '#fff'; c.strokeStyle = '#fff';
  c.lineWidth = 2 / k; c.lineJoin = 'round';            // small dilation covers coastal detail
  b.strokeStyle = '#fff'; b.lineWidth = 1.8 / k; b.lineJoin = 'round';

  for (const f of feats) {
    for (const ring of ringsOf(f.geometry)) {
      const path = new Path2D();
      for (let i = 0; i < ring.length; i++) {
        const [x, y] = G.toPX(ring[i][0], ring[i][1]);
        i ? path.lineTo(x, y) : path.moveTo(x, y);
      }
      path.closePath();
      c.fill(path); c.stroke(path); b.stroke(path);
    }
  }

  const md = c.getImageData(0, 0, W, H).data, bd = b.getImageData(0, 0, W, H).data;
  const mask = new Uint8Array(W * H), bnd = new Uint8Array(W * H);
  for (let i = 0, p = 0; i < mask.length; i++, p += 4) { mask[i] = md[p]; bnd[i] = bd[p + 3]; }
  cv.width = cv.height = bv.width = bv.height = 1;
  stripPerimeter(G, mask, bnd);
  return { mask, bnd };
}

// drop strokes that sit on the outer edge of the landmass, keeping interior state lines only
function stripPerimeter(G, mask, bnd) {
  const { W, H } = G;
  const D = Math.max(3, Math.round(5 / G.scale)), N = D * 2 + 1, area = N * N;
  const cl = (v, m) => v < 0 ? 0 : v > m ? m : v;
  const row = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) {
    const o = y * W; let s = 0;
    for (let k = -D; k <= D; k++) s += mask[o + cl(k, W - 1)] > 127 ? 1 : 0;
    for (let x = 0; x < W; x++) {
      row[o + x] = s;
      s += (mask[o + cl(x + D + 1, W - 1)] > 127 ? 1 : 0) - (mask[o + cl(x - D, W - 1)] > 127 ? 1 : 0);
    }
  }
  for (let x = 0; x < W; x++) {
    let s = 0;
    for (let k = -D; k <= D; k++) s += row[cl(k, H - 1) * W + x];
    for (let y = 0; y < H; y++) {
      if (s > 0 && s < area) bnd[y * W + x] = 0;      // window straddles the outline
      s += row[cl(y + D + 1, H - 1) * W + x] - row[cl(y - D, H - 1) * W + x];
    }
  }
}

/* ─── 3. height fields + edge fade ──────────────────────────────── */
// lift mask = landmass plus any water it fully encloses (Great Lakes), so interior
// water rides up with the plate instead of becoming a pit. Flood-fills the complement
// from the raster border: zero regions the fill never reaches are interior.

      const sh = new THREE.Shape();
      poly[0].forEach(([lon, lat], i) => { const x = mxf(lon) * WORLD_REF - ORIGIN.x, z = myf(lat) * WORLD_REF - ORIGIN.y; i ? sh.lineTo(x, z) : sh.moveTo(x, z); cx += x; cz += z; n++; });
      for (let h = 1; h < poly.length; h++) { const hole = new THREE.Path(); poly[h].forEach(([lon, lat], i) => { const x = mxf(lon) * WORLD_REF - ORIGIN.x, z = myf(lat) * WORLD_REF - ORIGIN.y; i ? hole.lineTo(x, z) : hole.moveTo(x, z); }); sh.holes.push(hole); }
      // outline segments for every ring
      for (const ring of poly) {
        for (let i = 0; i < ring.length - 1; i++) {
          const a = ring[i], b = ring[i + 1];
          linePts.push(mxf(a[0]) * WORLD_REF - ORIGIN.x, 0.7, myf(a[1]) * WORLD_REF - ORIGIN.y);
          linePts.push(mxf(b[0]) * WORLD_REF - ORIGIN.x, 0.7, myf(b[1]) * WORLD_REF - ORIGIN.y);
        }
      }
      shapes.push(sh);
    }
    if (!shapes.length) continue;
    const geo = new THREE.ShapeGeometry(shapes); geo.rotateX(Math.PI / 2);
    const mat = new THREE.MeshBasicMaterial({ color: SIL_COLOR, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
    const mesh = new THREE.Mesh(geo, mat); mesh.position.y = 0.5; mesh.frustumCulled = false;
    silGroup.add(mesh);
    built.push({ mesh, cx: cx / n, cz: cz / n });
  }
  // HARD OUTLINE — full opacity from the very first frame so the country is always
  // there and the user never stares at nothing while the fill builds
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(linePts, 3));
  silOutline = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: OUTLINE_COLOR, transparent: true, opacity: OUTLINE_OP, depthWrite: false, depthTest: false }));
  silOutline.renderOrder = 1; silOutline.frustumCulled = false;
  silGroup.add(silOutline);
  // order states by distance from centre → fill seeks outward (fixed-time paced)
  built.sort((a, b) => Math.hypot(a.cx, a.cz) - Math.hypot(b.cx, b.cz));
  const nB = built.length || 1;
  silStates = built.map((b, i) => ({ mesh: b.mesh, p0: (i / nB) * 0.8 }));
  silStart = performance.now();
  scene.add(silGroup);
}

/* Alaska + Hawaii insets — the main pipeline drops both. We run a compact copy of
   the same DEM → relief pipeline over each state's own bounding box, clip the ocean
   to transparent, then scale the little 3D mesh down and place it beside the
   lower-48 (AK right, HI left). If a DEM fetch fails we fall back to a flat card.
   Position / scale / detail-zoom live in INSET_SPEC — nudge to taste. */
const insetMats = [];   // { mat, target, t0 }
const INSET_SPEC = {
  // tucked into the ocean BELOW the lower-48 (AK under California, HI under Texas),
  // the way a conventional US map lays them out
  Alaska: { cx: -PLATE.w * 0.18, cz:  PLATE.h * 0.24, w: PLATE.w * 0.17,  z: 5, mesh: 340, clampLonMin: -170 },
  Hawaii: { cx: -PLATE.w * 0.04, cz:  PLATE.h * 0.26, w: PLATE.w * 0.085, z: 7, mesh: 260, clampLonMin: null },
};

// a grid anchored on ITS OWN centre, so the built mesh sits around the local origin
function gridFor(bbox, z) {
  const n = 2 ** z;
  const tx0 = Math.floor(mxf(bbox.lonMin) * n), tx1 = Math.floor(mxf(bbox.lonMax) * n);
  const ty0 = Math.floor(myf(bbox.latMax) * n), ty1 = Math.floor(myf(bbox.latMin) * n);
  const W = (tx1 - tx0 + 1) * 256, H = (ty1 - ty0 + 1) * 256;
  const scale = 2 ** (REF - z), px0 = tx0 * 256, py0 = ty0 * 256;
  const ox = (px0 + W / 2) * scale, oy = (py0 + H / 2) * scale;
  const latMidL = (bbox.latMin + bbox.latMax) / 2;
  const mppL = 156543.03392 * Math.cos(latMidL * Math.PI / 180) / 2 ** z;
  return {
    z, W, H, tx0, tx1, ty0, ty1, px0, py0, scale, mpp: mppL,
    toPX: (lon, lat) => [mxf(lon) * 256 * n - px0, myf(lat) * 256 * n - py0],
    sx: fx => (px0 + fx) * scale - ox,
    sz: fy => (py0 + fy) * scale - oy,
    fadePx: FADE_KM * 1000 / mppL,
  };
}

// drop antimeridian (western Aleutian) parts so the projection stays contiguous
function usableRings(feat) {
  const g = feat.geometry;
  const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
  const keep = polys.filter(poly => poly[0].every(p => p[0] < 0));
  return { properties: feat.properties, geometry: { type: 'MultiPolygon', coordinates: keep } };
}
function bboxOf(feat, clampLonMin) {
  let lonMin = Infinity, lonMax = -Infinity, latMin = Infinity, latMax = -Infinity;
  for (const poly of feat.geometry.coordinates) for (const ring of poly) for (const p of ring) {
    if (p[0] < lonMin) lonMin = p[0]; if (p[0] > lonMax) lonMax = p[0];
    if (p[1] < latMin) latMin = p[1]; if (p[1] > latMax) latMax = p[1];
  }
  if (clampLonMin != null) lonMin = Math.max(lonMin, clampLonMin);
  return { lonMin, lonMax, latMin, latMax };
}

// shared projection: mercator → scaled + centred at the inset slot (matches the outline)
function insetProject(feat, spec) {
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  const polys = feat.geometry.coordinates.map(poly => poly.map(ring => ring.map(([lon, lat]) => {
    if (lon > 0) lon -= 360;
    const x = mxf(lon) * WORLD_REF - ORIGIN.x, z = myf(lat) * WORLD_REF - ORIGIN.y;
    if (x < minX) minX = x; if (x > maxX) maxX = x; if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
    return [x, z];
  })));
  const s = spec.w / Math.max(maxX - minX, 1), ocx = (minX + maxX) / 2, ocz = (minZ + maxZ) / 2;
  return { polys, tf: (x, z) => [spec.cx + (x - ocx) * s, spec.cz + (z - ocz) * s] };
}

// AK/HI silhouettes for the loading sweep — a filled shape + outline in each inset
// slot, drawn exactly like the lower-48 placeholders so they come up as part of the
// same left-to-right sweep. They PERSIST past the US reveal (they sit outside the
// main plate) and crossfade out as each state's 3D relief arrives — never a pop.
const insetSil = {};            // name -> { fillMat, lineMat, p0, fade }
const insetSilList = [];
function buildInsetSil(feat, spec, name, p0) {
  const { polys, tf } = insetProject(feat, spec);
  const shapes = [];
  for (const poly of polys) {
    const sh = new THREE.Shape();
    poly[0].forEach((p, i) => { const [x, z] = tf(p[0], p[1]); i ? sh.lineTo(x, z) : sh.moveTo(x, z); });
    for (let h = 1; h < poly.length; h++) { const hp = new THREE.Path(); poly[h].forEach((p, i) => { const [x, z] = tf(p[0], p[1]); i ? hp.lineTo(x, z) : hp.moveTo(x, z); }); sh.holes.push(hp); }
    shapes.push(sh);
  }
  if (!shapes.length) return;
  const geo = new THREE.ShapeGeometry(shapes); geo.rotateX(Math.PI / 2);
  const fillMat = new THREE.MeshBasicMaterial({ color: SIL_COLOR, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
  const fill = new THREE.Mesh(geo, fillMat); fill.position.y = 0.55; fill.renderOrder = 0; fill.frustumCulled = false; scene.add(fill);

  const pts = [];
  for (const poly of polys) for (const ring of poly) for (let i = 0; i < ring.length - 1; i++) {
    const a = tf(ring[i][0], ring[i][1]), b = tf(ring[i + 1][0], ring[i + 1][1]);
    pts.push(a[0], 0.9, a[1], b[0], 0.9, b[1]);
  }
  const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const lineMat = new THREE.LineBasicMaterial({ color: OUTLINE_COLOR, transparent: true, opacity: 0, depthWrite: false, depthTest: false });
  const line = new THREE.LineSegments(lg, lineMat); line.renderOrder = 1; line.frustumCulled = false; scene.add(line);

  const rec = { fillMat, lineMat, p0, fade: 1 };
  insetSil[name] = rec; insetSilList.push(rec);
}

async function buildInsetOutlines() {
  let feats;
  try { feats = (await (await fetch('./us-states-lite.geojson')).json()).features; }
  catch (e) { return; }
  const P0 = { Alaska: 0.82, Hawaii: 0.9 };   // far left → they come in at the tail of the sweep
  for (const name of Object.keys(INSET_SPEC)) {
    const raw = feats.find(f => f.properties && f.properties.name === name);
    if (!raw) continue;
    const feat = usableRings(raw);
    if (feat.geometry.coordinates.length) buildInsetSil(feat, INSET_SPEC[name], name, P0[name] != null ? P0[name] : 0.85);
  }
}

// once a state's relief is up, crossfade its loading silhouette out
function retireInsetOutline(name) {
  const rec = insetSil[name];
  if (!rec) return;
  const f0 = rec.fade;
  tween(1000, k => { rec.fade = f0 * (1 - k); });
}

async function buildInset3D(feat, spec, name) {
  const pad = 0.4;
  const b0 = bboxOf(feat, spec.clampLonMin);
  const bb = { lonMin: b0.lonMin - pad, lonMax: b0.lonMax + pad, latMin: b0.latMin - pad, latMax: b0.latMax + pad };
  const G = gridFor(bb, spec.z);
  const elev = await loadDEM(G, () => {});
  const { mask, bnd } = rasterStates(G, [feat]);
  const lift = liftMaskOf(G, mask);
  const hS = heightField(G, elev, EXAG_S, G.mpp, false, lift);
  const sh = await castShadow(G, hS, () => {});
  const cv = await bakeTexture(G, elev, hS, mask, bnd, sh, () => {}, true);   // clip → ocean transparent
  const hG = heightField(G, elev, EXAG, MPP_REF, true, lift);
  const geo = await buildMesh(G, hG, spec.mesh, () => {});

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.minFilter = THREE.LinearMipmapLinearFilter; tex.generateMipmaps = true; tex.magFilter = THREE.LinearFilter;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0, alphaTest: 0.02, side: THREE.DoubleSide, depthWrite: false });
  const mesh = new THREE.Mesh(geo, mat); mesh.frustumCulled = false;

  // size/centre on the STATE's own footprint (not the padded DEM rectangle) so the
  // relief lands exactly where the loading outline drew it
  let sMinX = Infinity, sMaxX = -Infinity, sMinZ = Infinity, sMaxZ = -Infinity;
  for (const poly of feat.geometry.coordinates) for (const ring of poly) for (const [lon, lat] of ring) {
    const pxy = G.toPX(lon, lat), x = G.sx(pxy[0]), z = G.sz(pxy[1]);
    if (x < sMinX) sMinX = x; if (x > sMaxX) sMaxX = x; if (z < sMinZ) sMinZ = z; if (z > sMaxZ) sMaxZ = z;
  }
  const sizeX = Math.max(sMaxX - sMinX, 1);
  mesh.position.set(-(sMinX + sMaxX) / 2, 0, -(sMinZ + sMaxZ) / 2);
  const grp = new THREE.Group();
  grp.add(mesh);
  grp.scale.setScalar(spec.w / sizeX);
  grp.position.set(spec.cx, 1.0, spec.cz);
  grp.renderOrder = 2;
  scene.add(grp);
  insetMats.push({ mat, target: 1, t0: performance.now() });
  retireInsetOutline(name);
}

function buildInsetFlat(feat, spec, name) {
  const FILL = new THREE.Color(curTheme === 'dark' ? 0x2b83a0 : 0x3f9db0);
  const LINE = new THREE.Color(curTheme === 'dark' ? 0x9fc4d8 : 0x0d2634);
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  const proj = feat.geometry.coordinates.map(poly => poly.map(ring => ring.map(([lon, lat]) => {
    if (lon > 0) lon -= 360;
    const x = mxf(lon) * WORLD_REF - ORIGIN.x, z = myf(lat) * WORLD_REF - ORIGIN.y;
    if (x < minX) minX = x; if (x > maxX) maxX = x; if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
    return [x, z];
  })));
  const s = spec.w / Math.max(maxX - minX, 1), ocx = (minX + maxX) / 2, ocz = (minZ + maxZ) / 2;
  const tf = (x, z) => [spec.cx + (x - ocx) * s, spec.cz + (z - ocz) * s];
  const shapes = [], linePts = [];
  for (const poly of proj) {
    const sh = new THREE.Shape();
    poly[0].forEach((pt, i) => { const [x, z] = tf(pt[0], pt[1]); i ? sh.lineTo(x, z) : sh.moveTo(x, z); });
    for (let h = 1; h < poly.length; h++) {
      const hp = new THREE.Path();
      poly[h].forEach((pt, i) => { const [x, z] = tf(pt[0], pt[1]); i ? hp.lineTo(x, z) : hp.moveTo(x, z); });
      sh.holes.push(hp);
    }
    shapes.push(sh);
    for (const ring of poly) for (let i = 0; i < ring.length - 1; i++) {
      const a = tf(ring[i][0], ring[i][1]), b = tf(ring[i + 1][0], ring[i + 1][1]);
      linePts.push(a[0], 0.9, a[1], b[0], 0.9, b[1]);
    }
  }
  if (!shapes.length) return;
  const geo = new THREE.ShapeGeometry(shapes); geo.rotateX(Math.PI / 2);
  const fillMat = new THREE.MeshBasicMaterial({ color: FILL, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
  const mesh = new THREE.Mesh(geo, fillMat); mesh.position.y = 0.6; mesh.renderOrder = 2; mesh.frustumCulled = false;
  scene.add(mesh); insetMats.push({ mat: fillMat, target: 1, t0: performance.now() });
  const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(linePts, 3));
  const lineMat = new THREE.LineBasicMaterial({ color: LINE, transparent: true, opacity: 0, depthWrite: false, depthTest: false });
  const line = new THREE.LineSegments(lg, lineMat); line.renderOrder = 3; line.frustumCulled = false;
  scene.add(line); insetMats.push({ mat: lineMat, target: 0.85, t0: performance.now() });
  retireInsetOutline(name);
}

async function buildInsets() {
  let feats;
  try { feats = (await (await fetch('./us-states-lite.geojson')).json()).features; }
  catch (e) { console.warn('insets: states file failed', e); return; }
  for (const name of Object.keys(INSET_SPEC)) {
    const raw = feats.find(f => f.properties && f.properties.name === name);
    if (!raw) continue;
    const feat = usableRings(raw);
    if (!feat.geometry.coordinates.length) continue;
    try { await buildInset3D(feat, INSET_SPEC[name], name); }
    catch (e) { console.warn('inset 3D failed for', name, '— using flat', e); try { buildInsetFlat(feat, INSET_SPEC[name], name); } catch (e2) {} }
  }
}

function finishReveal() {
  if (introPhase === 'done') return;
  introPhase = 'done';
  camera.position.copy(overviewPos);
  controls.target.copy(overviewTgt);
  scene.background.copy(BG_COL);
  if (scene.fog) scene.fog.color.copy(BG_COL);
  controls.enabled = true; controls.update();
  _revealResolve();
}

const group = new THREE.Group();
group.name = 'us_relief';
group.scale.y = 0;                   // built flat; extrudes up on reveal
group.visible = false;               // hidden behind the silhouette until the reveal
scene.add(group);

// Large ground plane matching the relief's faded margin (BG, lit the same way) so
// the world reads as continuous — you never see "where the map ends" during the
// zoomed-out dive, when tilting, or when panning.
let groundMesh = null;                  // kept so the theme toggle can recolour it live
(() => {
  const gR = grid(REF);
  const cx = (gR.px0 + gR.W / 2) * gR.scale - ORIGIN.x;
  const cz = (gR.py0 + gR.H / 2) * gR.scale - ORIGIN.y;
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(PLATE.w * 7, PLATE.h * 7),
    // polygonOffset pushes the ground slightly back in the depth buffer so the relief
    // ALWAYS wins the tie where the two meet. Without it, the ocean/bathymetry (which
    // bakes to the same grey as this plane) dips just below y=0 and crosses the plane
    // around the map's faded edge — two coplanar, same-coloured surfaces that z-fight
    // and shimmer as the camera moves. They're the same colour, so it doesn't matter
    // which one wins; it just has to be consistent.
    new THREE.MeshLambertMaterial({ color: BG, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 2 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(cx, -0.5, cz);   // just under the relief base
  ground.renderOrder = -1;
  ground.frustumCulled = false;
  scene.add(ground);
  groundMesh = ground;
})();

// bounded pan: allow a little dragging to explore, but keep the continent framed
// so you can't fling it out to the edges (where the flat plate reads as spinning)
const PAN_X = PLATE.w * 0.24, PAN_Z = PLATE.h * 0.24;   // wide enough to frame each N/S/E/W region
function clampPan() {
  if (controls.target.x < -PAN_X) controls.target.x = -PAN_X;
  else if (controls.target.x > PAN_X) controls.target.x = PAN_X;
  if (controls.target.z < -PAN_Z) controls.target.z = -PAN_Z;
  else if (controls.target.z > PAN_Z) controls.target.z = PAN_Z;
}

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  const wasMax = camera.position.distanceTo(controls.target) >= controls.maxDistance - 1;
  controls.maxDistance = fitDistance();
  if (wasMax || camera.position.distanceTo(controls.target) > controls.maxDistance) {
    const d = camera.position.clone().sub(controls.target).setLength(controls.maxDistance);
    camera.position.copy(controls.target).add(d);
  }
  controls.update();
});
// soft edge limits: instead of a dead stop at the max, gently rubber-band both
// the tilt (polar) and the left/right swing (azimuth) back toward neutral, so the
// map eases back to north-up whenever it's dragged too far — it never spins around
const SOFT_POLAR = 0.70;                         // ~40°; still safely above the 38° pin dive
const SOFT_AZ = 0.16 * Math.PI;                  // ~29°; beyond this the swing lerps back to north-up
const _sph = new THREE.Spherical(), _off = new THREE.Vector3();
function softLimits() {
  _off.copy(camera.position).sub(controls.target);
  _sph.setFromVector3(_off);
  let changed = false;
  if (_sph.phi > SOFT_POLAR) { _sph.phi += (SOFT_POLAR - _sph.phi) * 0.16; changed = true; }
  if (_sph.theta > SOFT_AZ)  { _sph.theta += (SOFT_AZ - _sph.theta) * 0.06; changed = true; }
  else if (_sph.theta < -SOFT_AZ) { _sph.theta += (-SOFT_AZ - _sph.theta) * 0.06; changed = true; }
  if (changed) { _off.setFromSpherical(_sph); camera.position.copy(controls.target).add(_off); }
}

const frameHooks = [];
const postFrameHooks = [];   // run AFTER the camera is fully settled for the frame (pins project here)

/* ── camera nav: a shared smooth fly used by the region jumps + zoom/reset ─
   while a fly is running the soft edge limits + pan clamp are suspended (see
   the loop) so the camera can travel cleanly to the target and settle there. */
let camFly = null;
function flyCam(p1, t1, ms = 1150) {
  camFly = { t0: performance.now(), ms, p0: camera.position.clone(), tv0: controls.target.clone(), p1: p1.clone(), t1: t1.clone() };
}
frameHooks.push(() => {
  if (!camFly) return;
  const k = ease(clamp01((performance.now() - camFly.t0) / camFly.ms));
  camera.position.lerpVectors(camFly.p0, camFly.p1, k);
  controls.target.lerpVectors(camFly.tv0, camFly.t1, k);
  controls.update();
  if (k >= 1) camFly = null;
});

// N/S/E/W buttons — lerp the camera over that quarter of the country, keeping
// the overview look direction so it reads as "flying to that region"
const REGIONS = {
  north: { lon: -99, lat: 47.5 }, south: { lon: -91, lat: 31 },
  east:  { lon: -79, lat: 40 },   west:  { lon: -114, lat: 41 },
};
const _viewDir = overviewPos.clone().sub(overviewTgt);
function gotoRegion(name) {
  const r = REGIONS[name]; if (!r) return;
  const tx = Math.max(-PAN_X, Math.min(PAN_X, mxf(r.lon) * WORLD_REF - ORIGIN.x));
  const tz = Math.max(-PAN_Z, Math.min(PAN_Z, myf(r.lat) * WORLD_REF - ORIGIN.y));
  const tgt = new THREE.Vector3(tx, 0, tz);
  const pos = tgt.clone().add(_viewDir.clone().setLength(controls.maxDistance * 0.6));
  flyCam(pos, tgt);
}
for (const b of document.querySelectorAll('#regions button')) {
  b.addEventListener('click', () => {
    document.querySelectorAll('#regions button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    gotoRegion(b.dataset.region);
  });
}

// discrete zoom — the VP wants a fixed number of zoom levels, not free zoom.
// Three stops (overview → mid → close) as fractions of the overview distance;
// + / − and the mouse wheel step between them. Continuous orbit-zoom is off.
const ZOOM_STOPS = [1, 0.64, 0.42];
let zoomLevel = 0;
function applyZoom(n, ms = 520) {
  zoomLevel = Math.max(0, Math.min(ZOOM_STOPS.length - 1, n));
  const off = camera.position.clone().sub(controls.target);
  const d = Math.max(controls.minDistance, controls.maxDistance * ZOOM_STOPS[zoomLevel]);
  flyCam(controls.target.clone().add(off.setLength(d)), controls.target.clone(), ms);
}
controls.enableZoom = false;
{
  const zi = document.getElementById('zoomIn'), zo = document.getElementById('zoomOut');
  if (zi) zi.addEventListener('click', () => applyZoom(zoomLevel + 1));
  if (zo) zo.addEventListener('click', () => applyZoom(zoomLevel - 1));
  let wheelLock = 0;
  renderer.domElement.addEventListener('wheel', e => {
    e.preventDefault();
    const now = performance.now();
    if (now < wheelLock) return;
    wheelLock = now + 260;                       // one notch = one level
    applyZoom(zoomLevel + (e.deltaY < 0 ? 1 : -1));
  }, { passive: false });
}

(function loop() {
  requestAnimationFrame(loop);
  for (const f of frameHooks) f();
  if (controls.enabled) controls.update();      // manual camera control during the intro
  if (introPhase === 'done' && !camFly) { softLimits(); clampPan(); }
  // Freeze the exact camera the frame will render with, THEN place the HTML pins.
  // Projecting them before update()/clamps left them a frame behind the map, which
  // read as jitter/stutter while dragging. Now they're locked to the same matrices.
  camera.updateMatrixWorld();
  camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  for (const f of postFrameHooks) f();
  renderer.render(scene, camera);
})();

// drive the fly-through: dive from the start, drift in the low fog if the map
// is still building, then punch through to overview once it's ready
// ONE continuous descent from high in the deck straight down to the overview
// framing. The clouds part partway down and the map/silhouette stays visible the
// whole time. No hold and no separate final push, so it reads as a single zoom.
frameHooks.push(() => {
  if (introPhase === 'done') return;
  const now = performance.now();
  const k = ease(clamp01((now - phaseT0) / INTRO_MS));
  camera.position.lerpVectors(introStart, overviewPos, k);
  controls.target.lerpVectors(introStartTgt, overviewTgt, k);   // slow eased pan: centre → left
  camera.lookAt(controls.target);
  scene.background.copy(SKY).lerp(BG_COL, k);      // sky eases into the map background
  if (scene.fog) scene.fog.color.copy(scene.background);
  if (!revealTriggered && k > 0.26) { revealTriggered = true; clouds.reveal(INTRO_MS * 0.66); }  // deck parts as we punch through
  if (k >= 1) finishReveal();
});

// silhouette: staggered fade-IN per state (loading), then a smooth fade-OUT when
// the real map lands — so nothing ever pops
frameHooks.push(() => {
  if (!silGroup) return;
  const now = performance.now();
  const fadeK = silFadeT0 == null ? 0 : clamp01((now - silFadeT0) / 1200);
  const fill = silStart == null ? 0 : clamp01((now - silStart) / FILL_MS);   // fixed, consistent pace
  // gate the reveal: only once the fill has finished AND the assets are ready
  if (!revealed && assetsReady && fill >= 1) doReveal();
  if (silOutline) silOutline.material.opacity = OUTLINE_OP * (1 - fadeK);
  for (const s of silStates) {
    const inK = smoothstep(s.p0, s.p0 + 0.18, fill);       // seeks outward over FILL_MS
    const op = SIL_OP * inK * (1 - fadeK);
    s.mesh.material.opacity = op;
    s.mesh.visible = op > 0.003;
  }
  if (silFadeT0 != null && fadeK >= 1) {
    scene.remove(silGroup);
    silStates.forEach(s => { s.mesh.geometry.dispose(); s.mesh.material.dispose(); });
    if (silOutline) { silOutline.geometry.dispose(); silOutline.material.dispose(); silOutline = null; }
    silGroup = null; silStates = [];
  }
});

// AK/HI silhouettes sweep in on the SAME clock as the lower-48 (so they're part of
// the one animation), then persist past the US reveal and crossfade out (rec.fade
// → 0) once their relief lands — driven by retireInsetOutline()
frameHooks.push(() => {
  if (silStart == null || !insetSilList.length) return;
  const fill = clamp01((performance.now() - silStart) / FILL_MS);
  for (const s of insetSilList) {
    const inK = smoothstep(s.p0, s.p0 + 0.18, fill);
    s.fillMat.opacity = SIL_OP * inK * s.fade;          // fill still sweeps in at the tail
    s.lineMat.opacity = OUTLINE_OP * s.fade;            // outline on from the start, like the lower-48
  }
});

// terrain extrusion: the map is built flat (group.scale.y = 0) and rises to
// full height as we punch through, so we "see the map, then it extrudes"
frameHooks.push(() => {
  if (extrudeT0 == null || group.scale.y >= 1) return;
  const k = ease(clamp01((performance.now() - extrudeT0) / EXTRUDE_MS));
  group.scale.y = k;
});

// AK/HI insets fade in when each finishes building (they load a little after the map)
frameHooks.push(() => {
  if (!insetMats.length) return;
  const now = performance.now();
  for (const im of insetMats) im.mat.opacity = im.target * clamp01((now - im.t0) / 1400);
});

/* ─── clouds — real 3D cloud cards in the scene (see clouds.js) ─────────
   The camera physically descends through the DECK on reveal; AMBIENT edge
   clouds + a few tertiary puffs and their drifting shadows persist and fade
   out as the camera dives toward a pin (distance from OVERVIEW_D → DIVE_END). */
const W = PLATE.w, H = PLATE.h;
const OVERVIEW_D = controls.maxDistance;
const DIVE_END = 1900;                    // distance at which clouds are fully gone (matches pin fly-in)
function diveProgress() {
  const d = camera.position.distanceTo(controls.target);
  return Math.min(1, Math.max(0, (OVERVIEW_D - d) / (OVERVIEW_D - DIVE_END)));
}
const clouds = initClouds({
  scene, theme: THEME, plate: PLATE, overviewDistance: OVERVIEW_D,
  getDiveProgress: diveProgress, onFrame: f => frameHooks.push(f),
});
initBirds({
  scene, theme: THEME, plate: PLATE, overviewDistance: OVERVIEW_D,
  getDiveProgress: diveProgress, onFrame: f => frameHooks.push(f),
});

/* ISS easter egg — now a real object in the sky (a Sprite) high above the deck, so
   it parallaxes with zoom exactly like the clouds and fades on the dive. The PNG is
   pre-blurred + darkened + given a touch more contrast in a canvas. First pass at
   0:20, then once every 5 minutes. */
(function () {
  const ISS_Y = OVERVIEW_D * 0.60;                  // much higher in the sky than the clouds
  const ISS_Z = -PLATE.h * 0.18;
  const SPAN  = PLATE.w * 0.95;                      // travels this far either side of centre
  const DUR   = 26000;
  const mat = new THREE.SpriteMaterial({ transparent: true, opacity: 0, depthWrite: false });
  const spr = new THREE.Sprite(mat);
  spr.scale.set(PLATE.w * 0.06, PLATE.w * 0.06, 1);
  spr.visible = false; spr.renderOrder = 5;
  scene.add(spr);

  const img = new Image();
  img.onload = () => {
    const m = 12, c = document.createElement('canvas');
    c.width = img.width + m * 2; c.height = img.height + m * 2;
    const cx = c.getContext('2d');
    cx.filter = 'blur(1.7px) brightness(0.7) contrast(1.28) saturate(1.05)';   // slightly blurry + darker + more contrasty
    cx.drawImage(img, m, m);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    mat.map = t; mat.needsUpdate = true;
    const s = PLATE.w * 0.06;
    spr.scale.set(s * (c.width / c.height), s, 1);
  };
  img.src = 'assets/iss.png';

  let t0 = null, driftZ = 0, yJit = 0;
  function start() {
    if (document.hidden) return;
    t0 = performance.now();
    driftZ = (Math.random() * 0.16 - 0.05) * PLATE.h;
    yJit  = (Math.random() * 0.12 - 0.06) * ISS_Y;
  }
  setTimeout(() => { start(); setInterval(start, 300000); }, 20000);

  frameHooks.push(() => {
    if (t0 == null) { if (spr.visible) spr.visible = false; return; }
    const p = (performance.now() - t0) / DUR;
    if (p >= 1) { t0 = null; spr.visible = false; mat.opacity = 0; return; }
    spr.visible = true;
    spr.position.set(-SPAN + 2 * SPAN * p + VIEW_DX, ISS_Y + yJit, ISS_Z + driftZ * p);
    const edge = Math.min(p / 0.12, (1 - p) / 0.12);
    mat.opacity = clamp01(edge) * 0.92 * (1 - diveProgress() * 0.85);   // fade on the dive, like the clouds
  });
})();

/* ─── build ─────────────────────────────────────────────────────── */
let current = null;
let bakeCache = null;                   // last pass's bake inputs, so a theme toggle can re-bake the texture live
function install(geo, texCanvas, name) {
  const tex = new THREE.CanvasTexture(texCanvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  // Basic, not Lambert: the texture already has hillshade + cast shadows baked in.
  // Relighting on the dive (low, tilted camera) double-darkened slopes and made
  // a harsh, jagged shadow around the pin. Basic shows the bake as-is.
  tex.magFilter = THREE.LinearFilter;
  const mat = new THREE.MeshBasicMaterial({ map: tex });
  mat.name = 'relief';
  const mesh = new THREE.Mesh(geo, mat);
  mesh.name = name;
  group.add(mesh);
  if (current) { group.remove(current); current.geometry.dispose(); current.material.map.dispose(); current.material.dispose(); }
  current = mesh;
}

async function pass(G, meshW, feats, from, to) {
  const seg = (a, b) => f => frac(from + (to - from) * (a + (b - a) * f));
  span(live ? 'refining' : 'elevation', from, to);
  let elev = await loadDEM(G, seg(0, 0.45));
  if (!live) span('borders', from, to);
  frac(from + (to - from) * 0.48);  await tick();
  let { mask, bnd } = rasterStates(G, feats);
  let liftM = liftMaskOf(G, mask);
  await tick();
  if (!live) span('shadows', from, to);
  let hS = heightField(G, elev, EXAG_S, G.mpp, false, liftM);
  let sh = await castShadow(G, hS, f => seg(0.5, 0.68)(f));
  if (!live) span('shading', from, to);
  const tex = await bakeTexture(G, elev, hS, mask, bnd, sh, f => seg(0.68, 0.9)(f));
  // Cache THIS pass's bake inputs for the live theme re-bake. It MUST track whatever
  // mesh is currently installed: the coarse (z4) and fine (z6) grids are tile-aligned
  // to different extents (their left edges differ by ~5.6° of longitude), so re-baking
  // from a stale coarse cache and painting it onto the fine mesh stretches the whole
  // map across the wrong footprint — the relief visibly jumps while the pins stay put.
  // Caching the fine set costs more memory, but it's the only way the re-bake stays
  // registered to the geometry (and to the pins) after the refinement pass lands.
  bakeCache = { G, elev, hS, mask, bnd, sh };
  hS = sh = bnd = null;                              // release local refs (kept alive via bakeCache)
  if (!live) span('surface', from, to);
  const hG = heightField(G, elev, EXAG, MPP_REF, true, liftM);
  mask = liftM = null;
  HEIGHTS = sampleHeights(G, hG);
  elev = null;
  const geo = await buildMesh(G, hG, meshW, f => seg(0.9, 1)(f));
  install(geo, tex, `relief_z${G.z}`);
  return geo;
}

/* tiny tween manager — update(k) is called each frame with eased 0→1, onDone at end */
const activeTweens = [];
function tween(ms, update, onDone) { activeTweens.push({ t0: performance.now(), ms, update, onDone }); }
frameHooks.push(() => {
  if (!activeTweens.length) return;
  const now = performance.now();
  for (let i = activeTweens.length - 1; i >= 0; i--) {
    const tw = activeTweens[i];
    const k = clamp01((now - tw.t0) / tw.ms);
    tw.update(k);
    if (k >= 1) { activeTweens.splice(i, 1); if (tw.onDone) tw.onDone(); }
  }
});

/* live theme switch — no reload, no blink. The relief is theme-independent, so we
   LERP the surround colours (background, fog, ground) over ~1s and cross-fade the
   re-baked texture on top over the same beat. The toggle thumb slides in CSS and
   the chrome eases via CSS transitions. */
async function applyTheme(next) {
  if ((next !== 'dark' && next !== 'light') || next === curTheme) return;
  curTheme = next;
  const isDark = next === 'dark';
  try { localStorage.setItem('usmap.theme', next); } catch (e) {}
  themeBar.dataset.mode = next;
  for (const b of themeBar.querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.theme === next));
  applyDarkCss(isDark);
  if (clouds && clouds.setTheme) clouds.setTheme(next);
  dispatchEvent(new CustomEvent('usmap:theme', { detail: next }));   // timeline + chrome ease via CSS transitions

  BG = isDark ? 0x032c47 : 0xeef0f2;
  GREY = isDark ? [0x03, 0x2c, 0x47] : [0xee, 0xf0, 0xf2];
  const toBG = new THREE.Color(BG);
  const fromBG = scene.background.clone();
  const fromFog = scene.fog ? scene.fog.color.clone() : null;
  const fromGround = groundMesh ? groundMesh.material.color.clone() : null;
  // Re-bake the relief texture FIRST (it carries the new surround/fade colour), then
  // drive the surround lerp AND the continent cross-fade off the SAME tween clock. The
  // background, fog, ground and the 3D relief all recolour together on one even beat —
  // no more of the map flipping colour a moment before or after the background.
  let base = null, ov = null, oldMap = null;
  if (bakeCache && current) {
    const { G, elev, hS, mask, bnd, sh } = bakeCache;
    const cv = await bakeTexture(G, elev, hS, mask, bnd, sh, () => {});
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    tex.minFilter = THREE.LinearMipmapLinearFilter; tex.generateMipmaps = true; tex.magFilter = THREE.LinearFilter;
    base = current;
    ov = new THREE.Mesh(base.geometry, new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0, depthWrite: false }));
    ov.renderOrder = (base.renderOrder || 0) + 1;
    base._pendingTex = tex;
    group.add(ov);
  }

  tween(1000, k => {
    scene.background.copy(fromBG).lerp(toBG, k);
    if (scene.fog) scene.fog.color.copy(fromFog).lerp(toBG, k);
    if (groundMesh) groundMesh.material.color.copy(fromGround).lerp(toBG, k);
    if (ov) ov.material.opacity = k;
  }, () => {
    if (!ov) return;
    oldMap = base.material.map;
    base.material.map = base._pendingTex; base.material.needsUpdate = true;
    if (oldMap) oldMap.dispose();
    group.remove(ov); ov.material.dispose();
    delete base._pendingTex;
  });
}

(async () => {
  span('borders', 0, 0.06);
  buildSilhouette();                 // local + instant → opaque US on-screen from the start (doesn't block the pipeline)
  buildInsetOutlines();              // AK/HI outlines come up with the intro; their relief fills in last
  const feats = await loadStates();

  const Gf = grid(Z_FAST);
  console.log(`fast pass  ${Gf.W}×${Gf.H} @ z${Z_FAST}  (${Gf.mpp.toFixed(0)} m/px)`);
  await pass(Gf, 620, feats, 0.06, 1);

  markAssetsReady();                 // coarse map ready — reveal fires once the fill also completes
  themeBar.style.opacity = '1';
  { const z = document.getElementById('zoom'), rg = document.getElementById('regions'), hn = document.getElementById('hint');
    if (z) z.style.opacity = '1'; if (rg) rg.style.opacity = '1'; if (hn) hn.style.opacity = '1'; }

  // build the pins now but keep them hidden; doReveal() fades them in with the map
  ui.init({
    scene, camera, controls, renderer, theme: THEME, states: feats,
    lonLatToScene: (lon, lat) => ({ x: mxf(lon) * WORLD_REF - ORIGIN.x, z: myf(lat) * WORLD_REF - ORIGIN.y }),
    heightAt,
    maxHeightIn,
    getMesh: () => current,
    onFrame: f => frameHooks.push(f),
    onAfterFrame: f => postFrameHooks.push(f),   // pin projection runs here, after the camera is final
  });
  { const pinsEl = document.getElementById('pins'); if (pinsEl) pinsEl.style.opacity = '0'; }

  if (Z_FINE > Z_FAST) {             // refine to full detail — deferred so the heavy work
    // doesn't stutter the reveal animation; wait for the reveal, then a beat, then refine
    await new Promise(res => { const t = setInterval(() => { if (revealed) { clearInterval(t); res(); } }, 100); });
    await new Promise(res => setTimeout(res, 1400));
    live = true;
    note.style.opacity = '1';
    const Gn = grid(Z_FINE);
    console.log(`fine pass  ${Gn.W}×${Gn.H} @ z${Z_FINE}  (${Gn.mpp.toFixed(0)} m/px)`);
    const geo = await pass(Gn, 1200, feats, 0, 1);
    note.style.opacity = '0';
    console.log('ready', geo.getAttribute('position').count.toLocaleString(), 'vertices');
  }

  buildInsets();                     // Alaska + Hawaii 3D relief — loads LAST, filling in behind their outlines

  window.__relief = { group, mesh: current };
  window.exportOBJ = () => dl(new OBJExporter().parse(group), 'us-relief.obj', 'text/plain');
  window.exportGLB = () => new GLTFExporter().parse(group, r => dl(r, 'us-relief.glb', 'model/gltf-binary'), {}, { binary: true });
  function dl(data, name, type) {
    const url = URL.createObjectURL(new Blob([data], { type }));
    const a = document.createElement('a'); a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
})().catch(e => { phaseEl.textContent = 'error — see console'; console.error(e && (e.message + '\n' + e.stack)); });
</script>
</body>
</html>
